# Tag v* → test, build Windows + macOS, publish to GitHub Releases via Electron Forge.
# Requires repo setting: Settings → Actions → General → Workflow permissions →
# "Read and write permissions" (so GITHUB_TOKEN can upload release assets).
#
# Before pushing a release tag: set "version" in package.json to the same semver as the tag
# (e.g. tag v1.0.4 → "version": "1.0.4"). The test job fails fast if they disagree so the
# release assets and GitHub Release always match the app version users see in-app.
#
# Published assets (user-facing only — internal Squirrel/Forge/blockmap files are removed by finalize-release):
#   Windows — Navio-Windows-Setup-{version}.exe (NSIS wizard) + Navio-{version}-win.zip (portable).
#   macOS   — Navio-macOS-{version}-arm64.dmg + Navio-macOS-{version}-x64.dmg + portable ZIPs.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify package.json version matches release tag
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if (-not $tag -or -not $tag.StartsWith('v')) {
            Write-Host "::error::Expected GITHUB_REF_NAME like v1.2.3, got: $tag"
            exit 1
          }
          $want = $tag.Substring(1)
          $pkg = Get-Content -Raw package.json | ConvertFrom-Json
          $got = [string]$pkg.version
          if ($got -ne $want) {
            Write-Host "::error::Tag is $tag (expects version $want) but package.json has version $got. Bump package.json before tagging."
            exit 1
          }
          Write-Host "Release version check OK: $tag ↔ package.json $got"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm test
      - run: npm run lint

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write bundled Google OAuth defaults (optional)
        shell: pwsh
        env:
          NAVIO_OAUTH_GOOGLE_CLIENT_ID: ${{ secrets.NAVIO_OAUTH_GOOGLE_CLIENT_ID }}
          NAVIO_OAUTH_GOOGLE_CLIENT_SECRET: ${{ secrets.NAVIO_OAUTH_GOOGLE_CLIENT_SECRET }}
        run: |
          $o = [ordered]@{
            oauthGoogleClientId = [string]$env:NAVIO_OAUTH_GOOGLE_CLIENT_ID
            oauthGoogleClientSecret = [string]$env:NAVIO_OAUTH_GOOGLE_CLIENT_SECRET
          }
          $o | ConvertTo-Json | Set-Content -Encoding utf8 electron/bundled-oauth-defaults.json
          if ($o.oauthGoogleClientId) { Write-Host 'bundled OAuth client id: set' } else { Write-Host 'bundled OAuth client id: empty (add NAVIO_OAUTH_GOOGLE_* repo secrets for Sign in with Google out of the box)' }
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Decode Windows signing certificate (optional)
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          PFX_PASS: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PFX_B64)) {
            Write-Host "WINDOWS_CERTIFICATE_PFX_BASE64 not set — building unsigned Windows artifacts."
            exit 0
          }
          $out = Join-Path $env:RUNNER_TEMP "navio-sign.pfx"
          [IO.File]::WriteAllBytes($out, [Convert]::FromBase64String($env:PFX_B64))
          Add-Content -Path $env:GITHUB_ENV -Value "WINDOWS_CERTIFICATE_FILE=$out"
          Add-Content -Path $env:GITHUB_ENV -Value "WINDOWS_CERTIFICATE_PASSWORD=$env:PFX_PASS"
      - run: npm ci
      - run: npm run make
        env:
          NODE_OPTIONS: --max-old-space-size=8192
      - name: Build NSIS installer (wizard; no Node.js on end-user PCs)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          NODE_OPTIONS: --max-old-space-size=8192
        run: npm run dist:win
      - name: Verify Windows installer (.exe) for GitHub Releases
        shell: pwsh
        run: |
          $exes = @(Get-ChildItem -Path out/make -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Extension -ieq '.exe' -and ($_.Name -match 'Setup|setup|INSTALLER|installer' -or $_.FullName -match 'squirrel') })
          if ($exes.Count -lt 1) {
            Write-Host "::error::Expected a Squirrel-style Windows Setup .exe under out/make. Listing out/make:"
            Get-ChildItem -Path out/make -Recurse -File | Select-Object -First 40 FullName
            exit 1
          }
          $exes | ForEach-Object { Write-Host "Windows installer: $($_.FullName)" }
      - name: Verify NSIS installer exists
        shell: pwsh
        run: |
          $nsis = @(Get-ChildItem -Path dist-eb -File -ErrorAction SilentlyContinue | Where-Object { $_.Name -like 'Navio-Windows-Setup-*.exe' })
          if ($nsis.Count -lt 1) {
            Write-Host "::error::Expected Navio-Windows-Setup-*.exe under dist-eb. Files:"
            Get-ChildItem dist-eb -File -ErrorAction SilentlyContinue | ForEach-Object { $_.Name }
            exit 1
          }
          $nsis | ForEach-Object { Write-Host "NSIS installer: $($_.FullName)" }
      - name: Stage NSIS files for release upload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path nsis-out | Out-Null
          $setup = @(Get-ChildItem -Path dist-eb -File -ErrorAction SilentlyContinue | Where-Object { $_.Name -like 'Navio-Windows-Setup-*.exe' })
          if ($setup.Count -lt 1) { Write-Host "::error::No Navio-Windows-Setup-*.exe in dist-eb"; exit 1 }
          $setup | ForEach-Object { Copy-Item $_.FullName nsis-out/ }
          $pz = @(Get-ChildItem -Path dist-eb -File -ErrorAction SilentlyContinue | Where-Object { $_.Name -like 'Navio-*-win.zip' })
          if ($pz.Count -lt 1) {
            Write-Host "::error::Expected Navio-*-win.zip under dist-eb (electron-builder zip target). Files:"
            Get-ChildItem dist-eb -File -ErrorAction SilentlyContinue | ForEach-Object { $_.Name }
            exit 1
          }
          $pz | ForEach-Object { Copy-Item $_.FullName nsis-out/; Write-Host "Windows portable zip: $($_.Name)" }
          Get-ChildItem nsis-out | ForEach-Object { Write-Host "Windows release file: $($_.Name)" }
      - uses: actions/upload-artifact@v4
        with:
          name: navio-windows-make
          path: out/make
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: navio-windows-nsis
          path: nsis-out
          retention-days: 3

  build-mac:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write bundled Google OAuth defaults (optional)
        shell: bash
        env:
          NAVIO_OAUTH_GOOGLE_CLIENT_ID: ${{ secrets.NAVIO_OAUTH_GOOGLE_CLIENT_ID }}
          NAVIO_OAUTH_GOOGLE_CLIENT_SECRET: ${{ secrets.NAVIO_OAUTH_GOOGLE_CLIENT_SECRET }}
        run: |
          node -e "const fs=require('fs');const o={oauthGoogleClientId:String(process.env.NAVIO_OAUTH_GOOGLE_CLIENT_ID||'').trim(),oauthGoogleClientSecret:String(process.env.NAVIO_OAUTH_GOOGLE_CLIENT_SECRET||'').trim()};fs.writeFileSync('electron/bundled-oauth-defaults.json',JSON.stringify(o,null,2));console.log(o.oauthGoogleClientId?'bundled OAuth client id: set':'bundled OAuth client id: empty');"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # Unsigned on hosted runners unless you add cert import + APPLE_* (see build.yml).
      - run: npm run make
        env:
          NODE_OPTIONS: --max-old-space-size=8192
      - name: Build macOS DMG installers (electron-builder; no Xcode project required on user Macs)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          NODE_OPTIONS: --max-old-space-size=8192
        run: npm run dist:mac
      - name: Verify macOS electron-builder artifacts (names from package.json + electron-builder.yml)
        run: node tools/verify-mac-eb-artifacts.cjs
      - name: Stage macOS electron-builder artifacts for release upload
        shell: bash
        run: |
          set -e
          mkdir -p mac-eb-out
          ver=$(node -p "require('./package.json').version")
          cp "dist-eb/Navio-macOS-${ver}-arm64.dmg" "dist-eb/Navio-macOS-${ver}-x64.dmg" mac-eb-out/
          cp "dist-eb/Navio-macPortable-${ver}-arm64.zip" "dist-eb/Navio-macPortable-${ver}-x64.zip" mac-eb-out/
          ls -la mac-eb-out
      - uses: actions/upload-artifact@v4
        with:
          name: navio-mac-make
          path: out/make
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: navio-mac-eb
          path: mac-eb-out
          retention-days: 3

  # Windows publish first (creates the GitHub Release for this tag).
  publish-windows:
    needs: [build-windows]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: navio-windows-make
          path: out/make
      - uses: actions/download-artifact@v4
        with:
          name: navio-windows-nsis
          path: nsis-out
      - run: npx electron-forge publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload NSIS installer to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $repo = "${{ github.repository }}"
          $files = @(Get-ChildItem -Path nsis-out -File -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName })
          if ($files.Count -lt 1) {
            Write-Host "::error::No files in nsis-out to upload"
            exit 1
          }
          $ghArgs = @('release', 'upload', $tag) + $files + @('--clobber', '--repo', $repo)
          & gh @ghArgs

  # macOS publish second (adds assets to the same release).
  publish-mac:
    needs: [build-mac, publish-windows]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: navio-mac-make
          path: out/make
      - uses: actions/download-artifact@v4
        with:
          name: navio-mac-eb
          path: mac-eb-out
      - run: npx electron-forge publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload macOS DMG installers to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          repo="${{ github.repository }}"
          upload=()
          while IFS= read -r -d '' f; do
            upload+=("$f")
          done < <(find mac-eb-out -type f -print0 2>/dev/null || true)
          if [ "${#upload[@]}" -lt 1 ]; then echo "::error::No files in mac-eb-out"; ls -la mac-eb-out || true; exit 1; fi
          gh release upload "$tag" "${upload[@]}" --clobber --repo "$repo"

  # GitHub always attaches “Source code (zip/tar.gz)” — not the app. Make the real downloads obvious
  # and fail the workflow if no built assets landed on the release (quota, permissions, etc.).
  finalize-release:
    needs: [publish-mac]
    runs-on: ubuntu-latest
    steps:
      - name: Remove internal artifacts from release page
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          repo="${{ github.repository }}"
          # Delete Squirrel auto-update files, Forge darwin zip, blockmaps, and update manifests.
          # These are consumed by the updater internally — they confuse users on the release page.
          gh api "repos/${repo}/releases/tags/${tag}" \
            --jq '.assets[] | "\(.id) \(.name)"' | \
          while IFS=" " read -r id name; do
            case "$name" in
              RELEASES|*.nupkg|latest.yml|latest-mac.yml|*.blockmap|Navio-darwin-*)
                echo "Removing internal asset: $name"
                gh api --method DELETE "repos/${repo}/releases/assets/${id}" || true
                ;;
              Navio-[0-9]*.Setup.exe)
                echo "Removing Squirrel Setup installer: $name"
                gh api --method DELETE "repos/${repo}/releases/assets/${id}" || true
                ;;
            esac
          done
          echo "Cleanup complete."
      - name: Verify release has built binaries (not only Source code)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          ver="${tag#v}"
          repo="${{ github.repository }}"
          names=$(gh release view "$tag" --repo "$repo" --json assets -q '[.assets[].name] | join("\n")')
          echo "Release assets:"
          echo "$names"
          if ! echo "$names" | grep -qE 'Navio-Windows-Setup-|Navio-win32-x64-|Navio-macOS-|Navio-macPortable-|Navio-.*-win\.zip|Navio-.*-mac\.zip|Navio-.*-(arm64|x64)\.zip|Setup\.exe|\.dmg'; then
            echo "::error::This release has no built Windows/mac artifacts (only GitHub's auto-generated Source code?). Check earlier jobs: artifact quota, GITHUB_TOKEN write access, or publish failures."
            exit 1
          fi
          if echo "$names" | grep -qi '^Source code'; then
            echo "Note: \"Source code\" archives are expected from GitHub — use the Navio-*.exe / *.zip / *.dmg rows above them."
          fi
      - name: Prepend install instructions to release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          ver="${tag#v}"
          repo="${{ github.repository }}"
          prev=$(gh release view "$tag" --repo "$repo" --json body -q .body)
          notes=$(mktemp)
          {
            echo "## Install Navio (built app)"
            echo ""
            echo "**Ignore \"Source code (zip)\" and \"Source code (tar.gz)\"** — GitHub adds those to every release. They are a **git snapshot** (\`package.json\`, \`src\`, …), **not** the runnable installer."
            echo ""
            echo "| Platform | Download from **Assets** (below) |"
            echo "|------------|-------------------------------------|"
            echo "| **Windows (installer)** | \`Navio-Windows-Setup-${ver}.exe\` |"
            echo "| **Windows (portable ZIP)** | \`Navio-${ver}-win.zip\` → extract, run \`navio-browser.exe\` next to \`ffmpeg.dll\` |"
            echo "| **macOS (Apple Silicon, portable ZIP)** | \`Navio-macPortable-${ver}-arm64.zip\` |"
            echo "| **macOS (Intel, portable ZIP)** | \`Navio-macPortable-${ver}-x64.zip\` |"
            echo "| **macOS (Apple Silicon, DMG)** | \`Navio-macOS-${ver}-arm64.dmg\` |"
            echo "| **macOS (Intel, DMG)** | \`Navio-macOS-${ver}-x64.dmg\` |"
            echo ""
            echo "---"
            echo ""
            echo "$prev"
          } > "$notes"
          gh release edit "$tag" --repo "$repo" --notes-file "$notes"
