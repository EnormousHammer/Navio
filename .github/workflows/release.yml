# Tag-driven builds only: CI does not create GitHub Releases or upload release assets.
# Download workflow artifacts from the run, then attach them to a release manually (or
# run `npm run publish` locally with a PAT if you use Forge’s GitHub publisher).

name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm test
      - run: npm run lint

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Decode Windows signing certificate (optional)
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          PFX_PASS: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PFX_B64)) {
            Write-Host "WINDOWS_CERTIFICATE_PFX_BASE64 not set — building unsigned Windows artifacts."
            exit 0
          }
          $out = Join-Path $env:RUNNER_TEMP "navio-sign.pfx"
          [IO.File]::WriteAllBytes($out, [Convert]::FromBase64String($env:PFX_B64))
          Add-Content -Path $env:GITHUB_ENV -Value "WINDOWS_CERTIFICATE_FILE=$out"
          Add-Content -Path $env:GITHUB_ENV -Value "WINDOWS_CERTIFICATE_PASSWORD=$env:PFX_PASS"
      - run: npm ci
      - run: npm run make
      - uses: actions/upload-artifact@v4
        with:
          name: navio-windows-make
          path: out/make

  build-mac:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run make
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      - uses: actions/upload-artifact@v4
        with:
          name: navio-mac-make
          path: out/make
