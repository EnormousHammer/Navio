# Tag v* → test, build Windows + macOS, publish to GitHub Releases via Electron Forge.
# Requires repo setting: Settings → Actions → General → Workflow permissions →
# "Read and write permissions" (so GITHUB_TOKEN can upload release assets).
#
# Before pushing a release tag: set "version" in package.json to the same semver as the tag
# (e.g. tag v1.0.4 → "version": "1.0.4"). The test job fails fast if they disagree so the
# release assets and GitHub Release always match the app version users see in-app.
#
# Published assets (electron-forge publish → GitHub Release “Assets”):
#   Windows — Squirrel Setup *.exe (installer) + zip; macOS — *.dmg + zip.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify package.json version matches release tag
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if (-not $tag -or -not $tag.StartsWith('v')) {
            Write-Host "::error::Expected GITHUB_REF_NAME like v1.2.3, got: $tag"
            exit 1
          }
          $want = $tag.Substring(1)
          $pkg = Get-Content -Raw package.json | ConvertFrom-Json
          $got = [string]$pkg.version
          if ($got -ne $want) {
            Write-Host "::error::Tag is $tag (expects version $want) but package.json has version $got. Bump package.json before tagging."
            exit 1
          }
          Write-Host "Release version check OK: $tag ↔ package.json $got"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm test
      - run: npm run lint

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Decode Windows signing certificate (optional)
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          PFX_PASS: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PFX_B64)) {
            Write-Host "WINDOWS_CERTIFICATE_PFX_BASE64 not set — building unsigned Windows artifacts."
            exit 0
          }
          $out = Join-Path $env:RUNNER_TEMP "navio-sign.pfx"
          [IO.File]::WriteAllBytes($out, [Convert]::FromBase64String($env:PFX_B64))
          Add-Content -Path $env:GITHUB_ENV -Value "WINDOWS_CERTIFICATE_FILE=$out"
          Add-Content -Path $env:GITHUB_ENV -Value "WINDOWS_CERTIFICATE_PASSWORD=$env:PFX_PASS"
      - run: npm ci
      - run: npm run make
        env:
          NODE_OPTIONS: --max-old-space-size=8192
      - name: Verify Windows installer (.exe) for GitHub Releases
        shell: pwsh
        run: |
          $exes = @(Get-ChildItem -Path out/make -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Extension -ieq '.exe' -and ($_.Name -match 'Setup|setup|INSTALLER|installer' -or $_.FullName -match 'squirrel') })
          if ($exes.Count -lt 1) {
            Write-Host "::error::Expected a Squirrel-style Windows Setup .exe under out/make. Listing out/make:"
            Get-ChildItem -Path out/make -Recurse -File | Select-Object -First 40 FullName
            exit 1
          }
          $exes | ForEach-Object { Write-Host "Windows installer: $($_.FullName)" }
      - uses: actions/upload-artifact@v4
        with:
          name: navio-windows-make
          path: out/make

  build-mac:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # Unsigned on hosted runners unless you add cert import + APPLE_* (see build.yml).
      - run: npm run make
        env:
          NODE_OPTIONS: --max-old-space-size=8192
      - name: Verify macOS disk image (.dmg) for GitHub Releases
        shell: bash
        run: |
          set -e
          mapfile -t dmgs < <(find out/make -type f -name '*.dmg' 2>/dev/null || true)
          if [ "${#dmgs[@]}" -lt 1 ]; then
            echo "::error::Expected at least one .dmg under out/make"
            find out/make -type f 2>/dev/null | head -40 || true
            exit 1
          fi
          printf '%s\n' "${dmgs[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: navio-mac-make
          path: out/make

  # Windows publish first (creates the GitHub Release for this tag).
  publish-windows:
    needs: [build-windows]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: navio-windows-make
          path: out/make
      - run: npx electron-forge publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # macOS publish second (adds assets to the same release).
  publish-mac:
    needs: [build-mac, publish-windows]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: navio-mac-make
          path: out/make
      - run: npx electron-forge publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
