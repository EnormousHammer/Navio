# PR/branch builds: we only verify installers exist — we do NOT upload out/make here.
# Uploading multi‑GB Squirrel/nupkg trees on every push exhausts the org’s GitHub Actions
# artifact quota (“Failed to CreateArtifact: Artifact storage quota has been hit”).
# Releases still upload artifacts in release.yml for publish jobs.

name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm test
      - run: npm run lint

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Decode Windows signing certificate (optional)
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          PFX_PASS: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PFX_B64)) { exit 0 }
          $out = Join-Path $env:RUNNER_TEMP "navio-sign.pfx"
          [IO.File]::WriteAllBytes($out, [Convert]::FromBase64String($env:PFX_B64))
          Add-Content -Path $env:GITHUB_ENV -Value "WINDOWS_CERTIFICATE_FILE=$out"
          Add-Content -Path $env:GITHUB_ENV -Value "WINDOWS_CERTIFICATE_PASSWORD=$env:PFX_PASS"
      - run: npm ci
      - run: npm run make
        env:
          NODE_OPTIONS: --max-old-space-size=8192
      - name: Build NSIS installer (unsigned CI)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          NODE_OPTIONS: --max-old-space-size=8192
        run: npm run dist:win
      - name: Verify Windows Setup .exe exists
        shell: pwsh
        run: |
          $exes = @(Get-ChildItem -Path out/make -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Extension -ieq '.exe' -and ($_.Name -match 'Setup|setup' -or $_.FullName -match 'squirrel') })
          if ($exes.Count -lt 1) { Write-Host "::error::No Windows Setup .exe under out/make"; exit 1 }
      - name: Verify NSIS installer exists
        shell: pwsh
        run: |
          $nsis = @(Get-ChildItem -Path dist-eb -File -ErrorAction SilentlyContinue | Where-Object { $_.Name -like 'Navio-Windows-Setup-*.exe' })
          if ($nsis.Count -lt 1) {
            Write-Host "::error::No Navio-Windows-Setup-*.exe under dist-eb"
            Get-ChildItem dist-eb -File -ErrorAction SilentlyContinue | ForEach-Object { $_.Name }
            exit 1
          }
      - name: Verify Windows portable ZIP exists
        shell: pwsh
        run: |
          $z = @(Get-ChildItem -Path dist-eb -File -ErrorAction SilentlyContinue | Where-Object { $_.Name -like 'Navio-*-win.zip' })
          if ($z.Count -lt 1) {
            Write-Host "::error::No Navio-*-win.zip under dist-eb"
            Get-ChildItem dist-eb -File -ErrorAction SilentlyContinue | ForEach-Object { $_.Name }
            exit 1
          }

  build-mac:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # Unsigned DMG/ZIP on GitHub-hosted macOS (no keychain cert). To sign in CI,
      # import a certificate (e.g. p12) in a prior step, then export APPLE_* here.
      - run: npm run make
        env:
          NODE_OPTIONS: --max-old-space-size=8192
      - name: Build macOS DMG installers (unsigned CI)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          NODE_OPTIONS: --max-old-space-size=8192
        run: npm run dist:mac
      - name: Verify macOS electron-builder artifacts (names from package.json + electron-builder.yml)
        run: node tools/verify-mac-eb-artifacts.cjs
