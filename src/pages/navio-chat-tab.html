<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Navio AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #03050a;
      --panel: rgba(12, 16, 28, 0.72);
      --elev: rgba(14, 18, 32, 0.88);
      --border: rgba(0, 216, 255, 0.18);
      --text: #eef2fb;
      --muted: #8b97b5;
      --accent: #22d8ff;
      --accent2: #6b7cff;
      --violet: #b388ff;
      --user-bg: rgba(84, 104, 255, 0.2);
      --radius: 16px;
      --font: "DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --header-h: 56px;
      --drawer-w: min(320px, 100vw);
      --glass: rgba(10, 14, 26, 0.55);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 15px;
      line-height: 1.55;
    }
    body {
      background:
        radial-gradient(ellipse 120% 70% at 50% 0%, rgba(0, 200, 255, 0.08), transparent 52%),
        linear-gradient(180deg, #070a12 0%, #03050a 38%, #020308 100%);
    }
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
      opacity: 0.45;
      pointer-events: none;
      z-index: 0;
    }
    .app {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      margin: 0 auto;
    }
    .app > header::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent 0%, rgba(0, 220, 255, 0.65) 28%, rgba(110, 130, 255, 0.75) 52%, rgba(180, 130, 255, 0.55) 78%, transparent 100%);
      opacity: 0.95;
      pointer-events: none;
      box-shadow: 0 0 24px rgba(0, 220, 255, 0.25);
    }
    .shell {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      width: 100%;
      max-width: 920px;
      margin: 0 auto;
      padding: 0 20px;
    }
    body.state-empty .shell {
      justify-content: center;
      max-width: 640px;
    }
    .chat-stage {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
    }
    body.state-empty .chat-stage {
      flex: 0 1 auto;
      justify-content: center;
      gap: 28px;
    }
    header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
      min-height: var(--header-h);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      background: linear-gradient(180deg, rgba(8, 12, 24, 0.92) 0%, rgba(4, 6, 14, 0.88) 100%);
      backdrop-filter: blur(24px) saturate(1.3);
      -webkit-backdrop-filter: blur(24px) saturate(1.3);
      position: relative;
    }
    body.state-empty header {
      border-bottom-color: transparent;
      background: rgba(4, 6, 14, 0.35);
    }
    body.state-chat header {
      background: linear-gradient(180deg, rgba(6, 10, 22, 0.94) 0%, rgba(3, 5, 12, 0.9) 100%);
      border-bottom-color: rgba(0, 220, 255, 0.1);
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.55), inset 0 -1px 0 rgba(255, 255, 255, 0.04);
    }
    body.state-chat .brand-text h1 {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .logo {
      width: 36px;
      height: 36px;
      border-radius: 11px;
      background: linear-gradient(135deg, var(--accent), var(--accent2) 55%, var(--violet));
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.12),
        0 4px 20px rgba(0, 216, 255, 0.22),
        0 12px 40px rgba(84, 104, 255, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo svg {
      width: 20px;
      height: 20px;
      opacity: 0.95;
      filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.35));
    }
    .brand-text h1 {
      margin: 0;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.02em;
      background: linear-gradient(120deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .brand-text p { margin: 2px 0 0; font-size: 11px; color: var(--muted); }
    body.state-empty .brand-text p { display: none; }
    .hdr-actions { display: flex; align-items: center; gap: 10px; }
    .pill {
      font-size: 10px;
      font-weight: 600;
      padding: 5px 11px;
      border-radius: 999px;
      border: 1px solid rgba(0, 216, 255, 0.22);
      color: var(--text);
      background: rgba(0, 216, 255, 0.08);
      max-width: 220px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    button.btn {
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    button.btn:hover { background: rgba(255,255,255,0.1); }
    button.btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: none;
      color: #fff;
    }
    .main {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      padding: 0 0 12px;
    }
    body.state-empty .main {
      flex: 0 0 auto;
      padding: 0;
    }
    #messages {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 16px 0 12px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }
    body.state-chat #messages {
      max-width: 680px;
      width: 100%;
      margin: 0 auto;
      padding: 20px 12px 120px;
      box-sizing: border-box;
    }
    .msg {
      max-width: min(94%, 560px);
      padding: 14px 18px;
      border-radius: var(--radius);
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 15px;
      line-height: 1.58;
    }
    .msg .body {
      font-size: 15px;
      line-height: 1.58;
    }
    .msg .role {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .msg.user {
      align-self: flex-end;
      border-radius: 20px 20px 6px 20px;
      background: linear-gradient(155deg, rgba(84, 104, 255, 0.28), rgba(40, 52, 100, 0.45));
      border: 1px solid rgba(130, 150, 255, 0.38);
      box-shadow:
        0 2px 0 rgba(255, 255, 255, 0.06) inset,
        0 12px 40px rgba(40, 60, 140, 0.25);
    }
    .msg.assistant {
      align-self: flex-start;
      border-radius: 20px 20px 20px 6px;
      background: linear-gradient(180deg, rgba(22, 28, 42, 0.98) 0%, rgba(14, 18, 30, 0.95) 100%);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-left: 3px solid rgba(0, 216, 255, 0.55);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }
    .msg.assistant.error { border-color: rgba(255, 100, 100, 0.35); color: #ffc9c9; }
    .msg.assistant.streaming { border-color: rgba(0, 216, 255, 0.25); }
    .drawer-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 40;
      backdrop-filter: blur(2px);
    }
    body.drawer-open .drawer-backdrop { display: block; }
    .drawer {
      position: fixed;
      top: 0;
      right: 0;
      width: var(--drawer-w);
      height: 100%;
      border-left: 1px solid var(--border);
      background: rgba(10, 14, 22, 0.97);
      backdrop-filter: blur(20px);
      display: flex;
      flex-direction: column;
      min-height: 0;
      z-index: 50;
      transform: translateX(100%);
      transition: transform 0.22s ease;
      box-shadow: -12px 0 40px rgba(0, 0, 0, 0.35);
    }
    body.drawer-open .drawer {
      transform: translateX(0);
    }
    .drawer-h {
      padding: 12px 14px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .drawer-h .drawer-title { flex: 1; min-width: 0; }
    #btn-drawer-close {
      flex-shrink: 0;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.05);
      color: var(--muted);
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
      padding: 0;
    }
    #btn-drawer-close:hover { color: var(--text); background: rgba(255,255,255,0.1); }
    #btn-activity { display: none; }
    #btn-activity.visible { display: inline-block; }
    .drawer-h span.ok { color: var(--accent); font-weight: 600; text-transform: none; letter-spacing: 0; }
    #agent-steps {
      flex: 1;
      overflow-y: auto;
      padding: 10px 12px 16px;
      font-size: 12px;
    }
    .step-row {
      padding: 8px 10px;
      margin-bottom: 6px;
      border-radius: 8px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.05);
    }
    .step-row .t { color: var(--accent); font-weight: 600; font-size: 10px; text-transform: uppercase; }
    .step-row .l { color: var(--text); margin-top: 4px; line-height: 1.4; }
    .plan-card {
      align-self: flex-start;
      max-width: min(96%, 560px);
      padding: 16px 18px;
      border-radius: 16px;
      background: linear-gradient(180deg, rgba(28, 22, 48, 0.55) 0%, rgba(14, 18, 30, 0.95) 100%);
      border: 1px solid rgba(159, 111, 255, 0.35);
      box-shadow: 0 12px 40px rgba(80, 60, 140, 0.15);
    }
    .plan-card h3 { margin: 0 0 10px; font-size: 14px; }
    .plan-card ol { margin: 0; padding-left: 18px; color: var(--text); font-size: 13px; }
    .plan-card .meta { font-size: 11px; color: var(--muted); margin-top: 8px; }
    .plan-actions { display: flex; gap: 8px; margin-top: 12px; }
    .composer-wrap {
      flex-shrink: 0;
      padding: 0 0 22px;
    }
    body.state-chat .composer-wrap {
      position: sticky;
      bottom: 0;
      z-index: 5;
      max-width: 680px;
      width: 100%;
      margin-left: auto;
      margin-right: auto;
      padding: 32px 12px 28px;
      margin-top: -40px;
      box-sizing: border-box;
      background: linear-gradient(180deg, rgba(6, 9, 16, 0) 0%, rgba(6, 9, 16, 0.55) 18%, rgba(6, 9, 16, 0.96) 45%, #060910 100%);
    }
    body.state-empty .composer-wrap {
      padding-bottom: 8px;
    }
    .composer {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      background: linear-gradient(180deg, rgba(20, 26, 40, 0.95) 0%, rgba(12, 16, 28, 0.98) 100%);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 10px 12px;
      box-shadow:
        0 0 0 1px rgba(0, 216, 255, 0.06),
        0 16px 48px rgba(0, 0, 0, 0.5);
    }
    body.state-chat .composer {
      border-radius: 22px;
      padding: 12px 14px;
      box-shadow:
        0 0 0 1px rgba(0, 216, 255, 0.12),
        0 0 40px rgba(0, 216, 255, 0.06),
        0 20px 56px rgba(0, 0, 0, 0.55);
    }
    body.state-empty .composer {
      border-radius: 22px;
      padding: 14px 16px;
      align-items: center;
      box-shadow: 0 16px 48px rgba(0,0,0,0.45);
    }
    .composer-inner {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 0;
    }
    .composer-toolbar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
    }
    body.state-empty .composer-toolbar {
      order: -1;
      justify-content: flex-end;
      margin-bottom: 0;
    }
    body.state-chat .composer-toolbar {
      order: 1;
      justify-content: flex-end;
    }
    #input {
      width: 100%;
      min-height: 48px;
      max-height: 180px;
      resize: none;
      border: none;
      background: transparent;
      color: var(--text);
      font: inherit;
      line-height: 1.45;
      outline: none;
    }
    body.state-empty #input {
      min-height: 52px;
      font-size: 16px;
    }
    #input::placeholder { color: var(--muted); }
    #send {
      flex-shrink: 0;
      width: 44px;
      height: 44px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #send:disabled { opacity: 0.45; cursor: not-allowed; }
    .hint {
      font-size: 11px;
      color: var(--muted);
      margin-top: 8px;
      text-align: center;
    }
    body.state-empty .hint { margin-top: 12px; opacity: 0.85; }
    .empty-hint {
      text-align: center;
      color: var(--muted);
      padding: 0 8px 8px;
      font-size: 15px;
      line-height: 1.55;
      max-width: 34em;
      margin: 0 auto;
    }
    body.state-empty .empty-hint {
      font-size: 14px;
      padding: 0 4px 4px;
    }
    .empty-hint strong { color: var(--accent); }
    .hero-title {
      text-align: center;
      margin: 0 0 6px;
      font-size: 26px;
      font-weight: 650;
      letter-spacing: -0.03em;
      background: linear-gradient(120deg, #f0f4fc 0%, var(--muted) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    body.state-chat .hero-title { display: none; }
    .typing {
      display: inline-flex;
      gap: 4px;
      align-items: center;
    }
    .typing i {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      opacity: 0.35;
      animation: bounce 1.2s infinite ease-in-out;
    }
    .typing i:nth-child(2) { animation-delay: 0.15s; }
    .typing i:nth-child(3) { animation-delay: 0.3s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.7); opacity: 0.35; }
      40% { transform: scale(1); opacity: 1; }
    }
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--elev);
      border: 1px solid var(--border);
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 13px;
      z-index: 100;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
  </style>
</head>
<body class="state-empty">
  <div class="app">
    <header>
      <div class="brand">
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M12 2L4 6.5V12c0 5.25 3.5 9.75 8 10 4.5-.25 8-4.75 8-10V6.5L12 2z" stroke="rgba(255,255,255,0.92)" stroke-width="1.5" stroke-linejoin="round"/>
            <path d="M9.5 11.5L11 13l3.5-3.5" stroke="rgba(255,255,255,0.92)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1>Navio AI</h1>
          <p id="subhead">Browser assistant</p>
        </div>
      </div>
      <div class="hdr-actions">
        <button type="button" class="btn" id="btn-activity" title="Agent activity">Activity</button>
        <button type="button" class="btn" id="btn-new">New chat</button>
      </div>
    </header>

    <div class="drawer-backdrop" id="drawer-backdrop" aria-hidden="true"></div>

    <div class="shell">
      <div class="chat-stage">
        <h2 class="hero-title">What can I help with?</h2>
        <section class="main">
          <div id="messages"></div>
        </section>

        <div class="composer-wrap">
          <div class="composer">
            <div class="composer-inner">
              <div class="composer-toolbar">
                <span class="pill" id="model-pill" title="Configured model">—</span>
              </div>
              <textarea id="input" rows="1" placeholder="Ask anything…" autocomplete="off"></textarea>
            </div>
            <button type="button" id="send" title="Send" aria-label="Send">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2L15 22l-4-9-9-4 20-7z"/></svg>
            </button>
          </div>
          <p class="hint"><kbd>Enter</kbd> send · <kbd>Shift</kbd>+<kbd>Enter</kbd> new line · Tools use your other tabs when needed</p>
        </div>
      </div>
    </div>

    <aside class="drawer" id="drawer" aria-label="Agent activity">
      <div class="drawer-h">
        <span class="drawer-title">Agent activity <span class="ok" id="drawer-status"></span></span>
        <button type="button" id="btn-drawer-close" aria-label="Close panel">×</button>
      </div>
      <div id="agent-steps"></div>
    </aside>
  </div>

  <script>
(function () {
  const api = window.navioChatTab;
  const messagesEl = document.getElementById('messages');
  const agentStepsEl = document.getElementById('agent-steps');
  const drawerStatus = document.getElementById('drawer-status');
  const modelPill = document.getElementById('model-pill');
  const subhead = document.getElementById('subhead');
  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const btnNew = document.getElementById('btn-new');
  const btnActivity = document.getElementById('btn-activity');
  const btnDrawerClose = document.getElementById('btn-drawer-close');
  const drawerBackdrop = document.getElementById('drawer-backdrop');

  let busy = false;
  let streamBubble = null;
  let streamBody = null;
  let agentStepIndex = 0;

  function updateLayoutMode() {
    const conv = messagesEl.querySelector('.msg, .plan-card');
    document.body.classList.toggle('state-empty', !conv);
    document.body.classList.toggle('state-chat', !!conv);
    inputEl.placeholder = conv
      ? 'Message…'
      : 'Ask anything…';
  }

  function openDrawer() {
    document.body.classList.add('drawer-open');
  }

  function closeDrawer() {
    document.body.classList.remove('drawer-open');
  }

  function toggleDrawer() {
    if (document.body.classList.contains('drawer-open')) closeDrawer();
    else openDrawer();
  }

  function post(payload) {
    if (api && api.postToHost) api.postToHost(payload);
  }

  function esc(s) {
    return String(s || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function clearEmpty() {
    messagesEl.querySelector('.empty-hint')?.remove();
  }

  function addUserBubble(text) {
    clearEmpty();
    const wrap = document.createElement('div');
    wrap.className = 'msg user';
    wrap.innerHTML = '<div class="role">You</div><div class="body"></div>';
    wrap.querySelector('.body').textContent = text || '';
    messagesEl.appendChild(wrap);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    updateLayoutMode();
  }

  function toast(t) {
    const el = document.createElement('div');
    el.className = 'toast';
    el.textContent = t;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 3200);
  }

  function ensureStreamBubble() {
    if (streamBubble) return;
    clearEmpty();
    streamBubble = document.createElement('div');
    streamBubble.className = 'msg assistant streaming';
    streamBubble.innerHTML = '<div class="role">Navio</div><div class="body"></div>';
    streamBody = streamBubble.querySelector('.body');
    streamBody.textContent = '';
    messagesEl.appendChild(streamBubble);
    updateLayoutMode();
  }

  function finalizeStream(text) {
    if (streamBubble && streamBody) {
      streamBody.textContent = text || '';
      streamBubble.classList.remove('streaming');
    }
    streamBubble = null;
    streamBody = null;
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function addAssistantBubble(text, isError) {
    clearEmpty();
    finalizeStream('');
    const wrap = document.createElement('div');
    wrap.className = 'msg assistant' + (isError ? ' error' : '');
    wrap.innerHTML = '<div class="role">Navio</div><div class="body"></div>';
    wrap.querySelector('.body').textContent = text || '';
    messagesEl.appendChild(wrap);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    updateLayoutMode();
  }

  function resetAgentPanel() {
    agentStepsEl.innerHTML = '';
    drawerStatus.textContent = '';
  }

  window.__navioGuestHost = {
    deliver: function (msg) {
      if (!msg || !msg.type) return;
      switch (msg.type) {
        case 'toast':
          toast(msg.text || '');
          break;
        case 'activityStart':
          resetAgentPanel();
          agentStepIndex = 0;
          drawerStatus.textContent = 'Working…';
          btnActivity.classList.add('visible');
          break;
        case 'toolStep': {
          agentStepIndex += 1;
          const row = document.createElement('div');
          row.className = 'step-row';
          row.innerHTML = '<div class="t">' + esc(msg.tool) + '</div><div class="l">' + esc(msg.label) + '</div>';
          agentStepsEl.appendChild(row);
          agentStepsEl.scrollTop = agentStepsEl.scrollHeight;
          btnActivity.classList.add('visible');
          if (agentStepIndex === 1) openDrawer();
          break;
        }
        case 'activityDone':
          drawerStatus.textContent = msg.stepsCount ? 'Done · ' + msg.stepsCount + ' steps' : 'Done';
          break;
        case 'plan': {
          clearEmpty();
          const card = document.createElement('div');
          card.className = 'plan-card';
          let html = '<h3>' + esc(msg.title) + '</h3><ol>';
          (msg.steps || []).forEach(function (s) {
            const a = s && s.action ? esc(s.action) : '';
            const d = s && s.details ? esc(s.details) : '';
            html += '<li><strong>' + a + '</strong>' + (d ? ' — ' + d : '') + '</li>';
          });
          html += '</ol>';
          if (msg.estimated_time) html += '<div class="meta">Estimated: ' + esc(msg.estimated_time) + '</div>';
          if (msg.risks) html += '<div class="meta">Note: ' + esc(msg.risks) + '</div>';
          html += '<div class="plan-actions">';
          html += '<button type="button" class="btn btn-primary" data-plan="approve">Approve & run</button>';
          html += '<button type="button" class="btn" data-plan="cancel">Cancel</button></div>';
          card.innerHTML = html;
          card.querySelector('[data-plan="approve"]').addEventListener('click', function () {
            post({ action: 'planAck', approved: true, title: msg.title });
            card.querySelector('.plan-actions').innerHTML = '<span style="color:var(--accent);font-size:12px">Approved — running…</span>';
          });
          card.querySelector('[data-plan="cancel"]').addEventListener('click', function () {
            post({ action: 'planAck', approved: false, title: msg.title });
            card.querySelector('.plan-actions').innerHTML = '<span style="color:var(--muted);font-size:12px">Cancelled</span>';
          });
          messagesEl.appendChild(card);
          messagesEl.scrollTop = messagesEl.scrollHeight;
          updateLayoutMode();
          break;
        }
        case 'streamDelta':
          ensureStreamBubble();
          if (streamBody) streamBody.textContent += msg.text || '';
          messagesEl.scrollTop = messagesEl.scrollHeight;
          break;
        case 'streamFinalize':
          finalizeStream(msg.content || '');
          busy = false;
          sendBtn.disabled = false;
          inputEl.disabled = false;
          break;
        case 'assistant':
          document.getElementById('research-wait')?.remove();
          busy = false;
          sendBtn.disabled = false;
          inputEl.disabled = false;
          addAssistantBubble(msg.content, !!msg.error);
          break;
        case 'researchStart':
          clearEmpty();
          busy = true;
          sendBtn.disabled = true;
          inputEl.disabled = true;
          const r = document.createElement('div');
          r.className = 'msg assistant streaming';
          r.id = 'research-wait';
          r.innerHTML = '<div class="role">Navio</div><div class="body"><span class="typing"><i></i><i></i><i></i></span> Deep research…</div>';
          messagesEl.appendChild(r);
          messagesEl.scrollTop = messagesEl.scrollHeight;
          updateLayoutMode();
          break;
        default:
          break;
      }
    }
  };

  async function loadModelHint() {
    try {
      if (!api || !api.getConfig) return;
      const cfg = await api.getConfig();
      const m = (cfg && cfg.aiModel) ? cfg.aiModel : '';
      if (m) modelPill.textContent = m;
      if (cfg && cfg.aiUseToolCalling === false) {
        subhead.textContent = 'Streaming mode (enable tool calling in Settings for full agent)';
      }
    } catch {}
  }

  function send(text) {
    const t = (text || '').trim();
    if (!t || busy) return;
    busy = true;
    sendBtn.disabled = true;
    inputEl.disabled = true;
    addUserBubble(t);
    post({ action: 'send', text: t });
  }

  function wire() {
    inputEl.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        send(inputEl.value);
        inputEl.value = '';
        inputEl.style.height = 'auto';
      }
    });
    inputEl.addEventListener('input', function () {
      inputEl.style.height = 'auto';
      inputEl.style.height = Math.min(inputEl.scrollHeight, 180) + 'px';
    });
    sendBtn.addEventListener('click', function () {
      send(inputEl.value);
      inputEl.value = '';
      inputEl.style.height = 'auto';
    });
    btnNew.addEventListener('click', function () {
      if (busy) return;
      messagesEl.innerHTML = '';
      resetAgentPanel();
      streamBubble = null;
      streamBody = null;
      btnActivity.classList.remove('visible');
      agentStepIndex = 0;
      closeDrawer();
      messagesEl.innerHTML = '<div class="empty-hint">New chat in this tab. History here is separate from the sidebar panel.</div>';
      updateLayoutMode();
      inputEl.focus();
    });
    btnActivity.addEventListener('click', function () {
      toggleDrawer();
    });
    btnDrawerClose.addEventListener('click', function () {
      closeDrawer();
    });
    drawerBackdrop.addEventListener('click', function () {
      closeDrawer();
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeDrawer();
    });
  }

  function boot() {
    if (!api || !api.postToHost) {
      messagesEl.innerHTML = '<div class="empty-hint">Open this tab from <strong>Navio</strong> (New Tab → Ask AI). It cannot run standalone.</div>';
      updateLayoutMode();
      return;
    }
    wire();
    loadModelHint();
    try {
      const params = new URLSearchParams(window.location.search || '');
      const initial = params.get('initial');
      if (initial) {
        const raw = decodeURIComponent(initial);
        if (raw.trim().startsWith('>>')) {
          const q = raw.replace(/^>>\s*/, '').trim();
          addUserBubble(raw.trim());
          post({ action: 'deepResearch', topic: q });
        } else {
          const sendText = raw.trim().startsWith('?') ? raw.trim().slice(1).trim() : raw.trim();
          if (sendText) send(sendText);
        }
      } else {
        messagesEl.innerHTML =
          '<div class="empty-hint">Full-page assistant — same capabilities as the sidebar, with room to work. ' +
          'Tools and browsing use your other tabs when needed.</div>';
      }
    } catch {
      messagesEl.innerHTML = '<div class="empty-hint">Ask anything below.</div>';
    }
    updateLayoutMode();
    inputEl.focus();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
  </script>
</body>
</html>
