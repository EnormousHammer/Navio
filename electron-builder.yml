appId: com.navioai.browser
productName: Navio
copyright: Copyright © 2026 Navio

# Releases attach assets via Forge + `gh`, not electron-builder (avoids GH_TOKEN during CI `dist:*`).
publish: null

# Main entry (mirrors package.json "main")
directories:
  output: dist-eb

# Files to include (mirrors forge.config.js asar + public extraResource)
files:
  - electron/**
  - src/**
  - public/**
  - package.json
  - "!node_modules/.cache"
  - "!**/*.map"

# Include the public/ folder as an extra resource (same as forge extraResource)
extraResources:
  - from: public
    to: public

# Windows: NSIS installer + portable ZIP (ZIP is the “no installer” download on Releases).
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
  icon: src/assets/icon.ico
  # Avoid pulling winCodeSign (7z with symlinks) on machines without symlink privilege / unsigned CI.
  signAndEditExecutable: false

nsis:
  artifactName: "Navio-Windows-Setup-${version}.${ext}"
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: src/assets/icon.ico
  uninstallerIcon: src/assets/icon.ico
  shortcutName: Navio
  deleteAppDataOnUninstall: false
  runAfterFinish: true

# macOS: separate DMGs for Apple Silicon vs Intel (standard Electron distribution pattern).
# Ad-hoc signing (identity '-') needs no Apple Developer cert but still runs on modern macOS
# (fully unsigned bundles are often blocked). Entitlements match Forge osxSign when you add a cert.
mac:
  identity: '-'
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  icon: src/assets/icon.png
  category: public.app-category.utilities

dmg:
  artifactName: "Navio-macOS-${version}-${arch}.${ext}"
  # DMG container signing is unnecessary and can confuse Gatekeeper on older macOS.
  sign: false

# Portable ZIP names (separate from DMG / NSIS). ${os} is e.g. mac / win per electron-builder.
zip:
  artifactName: "Navio-Portable-${os}-${version}-${arch}.${ext}"
