appId: com.navioai.browser
productName: Navio
copyright: Copyright © 2026 Navio

# Releases attach assets via Forge + `gh`, not electron-builder (avoids GH_TOKEN during CI `dist:*`).
publish: null

# Main entry (mirrors package.json "main")
directories:
  output: dist-eb

# Files to include in the app bundle.
# NOTE: public/ is NOT listed here — it is provided as an extraResource below,
# which places it outside the ASAR alongside the executable.  Listing it in
# both places caused an electron-builder "cannot overwrite" conflict that failed
# the Windows and macOS CI builds every time.
files:
  - electron/**
  - src/**
  - package.json
  - "!node_modules/.cache"
  - "!**/*.map"

# Include the public/ folder as an extra resource (same as forge extraResource)
extraResources:
  - from: public
    to: public

# Windows: NSIS installer + portable ZIP (ZIP is the "no installer" download on Releases).
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
  icon: src/assets/icon.ico
  # Disable signing so CI does not try to download winCodeSign or call signtool.
  signAndEditExecutable: false

nsis:
  artifactName: "Navio-Windows-Setup-${version}.${ext}"
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: src/assets/icon.ico
  uninstallerIcon: src/assets/icon.ico
  shortcutName: Navio
  deleteAppDataOnUninstall: true
  runAfterFinish: true

# macOS: separate DMGs for Apple Silicon vs Intel.
#
# identity: '-' uses ad-hoc signing so macOS does not block the app with a
# "damaged" alert on first launch.  hardenedRuntime MUST be false for ad-hoc
# signing — the two are incompatible and caused an instant codesign failure in
# every previous CI run.  When a real Apple Developer ID is added later, flip
# hardenedRuntime: true and add entitlements back.
#
# CSC_IDENTITY_AUTO_DISCOVERY=false is set in CI so electron-builder does not
# search the macOS keychain for a signing certificate.
mac:
  artifactName: "Navio-macPortable-${version}-${arch}.${ext}"
  identity: '-'
  hardenedRuntime: false
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  icon: src/assets/icon.png
  category: public.app-category.utilities

dmg:
  artifactName: "Navio-macOS-${version}-${arch}.${ext}"
  # Skip signing the DMG container itself (distinct from app signing).
  sign: false
